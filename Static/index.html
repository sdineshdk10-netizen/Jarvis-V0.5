<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#030a13"><link rel="manifest" href="manifest.json"><title>JARVIS</title><style>
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 50% 30%,#09263b,#030a13 65%);color:#a4eaff;font:15px system-ui;min-height:100dvh}main{max-width:560px;margin:auto;padding:24px 18px 100px}header{text-align:center;letter-spacing:7px;font-size:25px;color:#e0faff}small{display:block;letter-spacing:3px;color:#6da8bf;font-size:10px;margin-top:8px}.core{width:210px;height:210px;margin:30px auto;position:relative;display:grid;place-items:center}.ring{position:absolute;inset:0;border:2px dashed #247c9f;border-radius:50%;animation:spin 22s linear infinite}.ring:nth-child(2){inset:12px;border:5px solid #4ce2ff;border-left-color:transparent;border-right-color:transparent;filter:drop-shadow(0 0 7px cyan);animation-duration:9s}.ring:nth-child(3){inset:28px;border:8px dotted #176b91;animation-direction:reverse}.orb{width:115px;height:115px;border:1px solid #78eaff;border-radius:50%;background:radial-gradient(circle,#147b9b,#051a2c 65%);box-shadow:0 0 30px #00bfff88,inset 0 0 20px #00bfff;display:grid;place-items:center;animation:pulse 3s infinite}.busy .ring{animation-duration:2s}.busy .orb{animation-duration:.8s}@keyframes spin{to{transform:rotate(360deg)}}@keyframes pulse{50%{opacity:.65;box-shadow:0 0 45px #00bfff}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}#state{text-align:center;letter-spacing:4px;margin:12px}input,select,button,textarea{font:inherit;color:#bcefff;background:#081c2b;border:1px solid #235775;border-radius:9px;padding:12px}input,textarea{width:100%;margin:6px 0}button{cursor:pointer}button:disabled{opacity:.5}.row{display:flex;gap:8px;flex-wrap:wrap}.row>*{flex:1}nav{position:fixed;bottom:0;left:0;right:0;background:#061421;display:flex;justify-content:center;padding:10px 8px max(12px,env(safe-area-inset-bottom));gap:6px}nav button{font-size:12px;max-width:130px;flex:1}article{white-space:pre-wrap;overflow-wrap:anywhere;border:1px solid #163c53;background:#071522;padding:12px;border-radius:10px;margin:8px 0}label{font-size:12px;color:#8bb9ca}#error{color:#ffb9a6;white-space:pre-wrap}details{margin-top:12px}summary{cursor:pointer}svg{width:65px}</style></head><body><main><header>J.A.R.V.I.S.<small>PERSONAL INTELLIGENCE SYSTEM</small></header><div class="core" id="core"><div class="ring"></div><div class="ring"></div><div class="ring"></div><div class="orb"><svg viewBox="0 0 80 60" fill="none" stroke="#a9f5ff" stroke-width="2"><path d="M0 30H12L20 12L28 48L37 5L46 54L55 18L63 30H80"/></svg></div></div><div id="state">STANDBY</div><div class="row"><select id="workspace"><option>Personal</option><option>Dreamscape Partner</option><option>Office</option><option>DJ</option></select><select id="mode"><option value="local">Local AI</option><option value="cloud">Cloud AI</option></select></div><details><summary>Connection settings</summary><input id="token" type="password" placeholder="Private server token" autocomplete="off"><button id="connect">Connect</button><button id="logout">Disconnect</button></details><details><summary>Voice settings</summary><select id="language"><option value="tanglish">Tanglish</option><option value="ta">Tamil</option><option value="en">English</option></select><label><input id="speak" type="checkbox" style="width:auto"> Speak replies</label><button onclick="window.speechSynthesis?.cancel()">Stop speech</button></details><p id="error" role="alert"></p><section id="panel"></section></main><nav><button data-tab="Chat">Chat</button><button data-tab="Tools">Tools</button><button data-tab="Memory">Memory</button><button data-tab="Plugins">Plugins</button></nav><script>
const $=id=>document.getElementById(id);let tab='Chat',token=sessionStorage.getItem('jarvisToken')||'',busy=false;const ws=()=>$('workspace').value;const q=()=>'?workspace='+encodeURIComponent(ws());function node(tag,text,parent){let n=document.createElement(tag);n.textContent=text;parent.append(n);return n}async function api(path,method='GET',body){let r=await fetch('/api/'+path,{method,headers:{Authorization:'Bearer '+token,'Content-Type':'application/json'},body:body?JSON.stringify(body):undefined});let d=await r.json();if(!r.ok)throw Error(d.detail||'Request failed');return d}async function run(fn){if(busy)return;busy=true;$('error').textContent='';$('core').classList.add('busy');$('state').textContent='PROCESSING';try{await fn()}catch(e){$('error').textContent=e.message}finally{busy=false;$('core').classList.remove('busy');$('state').textContent='STANDBY'}}function button(text,parent,fn){let b=node('button',text,parent);b.onclick=()=>run(fn);return b}async function render(){let p=$('panel');p.replaceChildren();if(tab==='Chat'){let h=node('div','',p);let t=node('textarea','',p);t.placeholder='Enter your command';let mic=node('button','Microphone',p);let recognition;mic.onclick=()=>{if(recognition){recognition.stop();return}const R=window.SpeechRecognition||window.webkitSpeechRecognition;if(!R){$('error').textContent='Browser speech recognition unavailable. Use keyboard dictation instead.';return}if(!window.isSecureContext){$('error').textContent='Microphone requires HTTPS or localhost.';return}let r=new R();recognition=r;r.lang=$('language').value==='en'?'en-IN':'ta-IN';r.interimResults=false;r.continuous=false;r.onstart=()=>{mic.textContent='Stop microphone';$('error').textContent=''};r.onresult=e=>{t.value+=(t.value?' ':'')+e.results[0][0].transcript};r.onerror=e=>{$('error').textContent='Microphone: '+e.error};r.onend=()=>{recognition=null;mic.textContent='Microphone'};try{r.start()}catch(e){recognition=null;$('error').textContent=e.message}};button('Send',p,async()=>{if(!t.value.trim())return;let text=t.value;let d=await api('chat','POST',{text,workspace:ws(),mode:$('mode').value,language:$('language').value});await render();if($('speak').checked){if(!window.speechSynthesis)throw Error('Speech unavailable');let u=new SpeechSynthesisUtterance(d.reply);u.lang=$('language').value==='en'?'en-GB':'ta-IN';window.speechSynthesis.cancel();window.speechSynthesis.speak(u)}});button('Clear chat',p,async()=>{if(confirm('Delete this workspace chat history?')){await api('history'+q(),'DELETE');await render()}});if(token){for(let m of await api('history'+q()))node('article',(m.role==='user'?'YOU':'JARVIS')+'\n'+m.text,h)}}else if(tab==='Memory'){let t=node('textarea','',p);t.placeholder='What should JARVIS remember?';button('Save memory',p,async()=>{if(t.value.trim()){await api('memory','POST',{text:t.value,workspace:ws()});await render()}});for(let m of await api('memory'+q())){let a=node('article',m.text,p);button('Delete',a,async()=>{if(confirm('Delete this memory?')){await api('memory/'+m.id,'DELETE');await render()}})}}else if(tab==='Tools'){for(let [key,label] of [['time','Chennai time'],['gmail','Recent email IDs'],['drive','Recent Drive files'],['calendar','Upcoming events']])button(label,p,async()=>{let d=await api('tools/'+key,'POST');node('article',typeof d.result==='string'?d.result:JSON.stringify(d.result,null,2),p)})}else{for(let m of await api('plugins'))node('article',m.name+' — '+m.status,p)}}document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>run(async()=>{tab=b.dataset.tab;await render()}));$('workspace').onchange=()=>run(render);$('connect').onclick=()=>run(async()=>{token=$('token').value;await api('status');sessionStorage.setItem('jarvisToken',token);$('token').value='';await render()});$('logout').onclick=()=>{sessionStorage.removeItem('jarvisToken');token='';location.reload()};run(render);if('serviceWorker'in navigator)navigator.serviceWorker.register('/sw.js').catch(()=>{});
</script></body></html>
